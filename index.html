<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISO Millionär</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel für JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Roboto:wght@300;400;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #020617; /* Slate 950 */
        }
        .font-mono {
            font-family: 'Roboto Mono', monospace;
        }
        
        /* Custom Animations */
        @keyframes pulse-green {
            0%, 100% { background-color: #22c55e; box-shadow: 0 0 20px #22c55e; }
            50% { background-color: #16a34a; box-shadow: 0 0 5px #16a34a; }
        }
        .animate-pulse-green {
            animation: pulse-green 1s infinite;
        }

        /* Glassmorphism Utilities */
        .glass-panel {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(59, 130, 246, 0.3);
        }
        
        .answer-line-left {
            position: absolute;
            left: 0;
            top: 50%;
            width: 20px;
            height: 2px;
            background: #64748b;
            transform: translate(-10px, -50%);
        }
        .answer-line-right {
            position: absolute;
            right: 0;
            top: 50%;
            width: 20px;
            height: 2px;
            background: #64748b;
            transform: translate(10px, -50%);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- ICON KOMPONENTEN (SVG) ---
        const Trophy = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
        );
        const Phone = ({ size = 24, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        );
        const Users = ({ size = 24, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        );
        const Divide = ({ size = 24, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="6" r="1"/><line x1="5" x2="19" y1="12" y2="12"/><circle cx="12" cy="18" r="1"/></svg>
        );
        const RefreshCw = ({ size = 24, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
        );
        const XCircle = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>
        );

        // --- HAUPTKOMPONENTE ---
        const Game = () => {
            const [gameState, setGameState] = useState('start'); 
            const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
            const [selectedAnswer, setSelectedAnswer] = useState(null);
            const [revealResult, setRevealResult] = useState(false);
            const [earnedAmount, setEarnedAmount] = useState(0);
            const [isJokerModalOpen, setIsJokerModalOpen] = useState(false);
            const [jokerModalContent, setJokerModalContent] = useState(null);

            const [lifelines, setLifelines] = useState({
                fiftyFifty: true,
                audience: true,
                phone: true
            });
            
            const [hiddenAnswers, setHiddenAnswers] = useState([]);

            const moneyLadder = useMemo(() => [
                50, 100, 200, 300, 500,           
                1000, 2000, 4000, 8000, 16000,    
                32000, 64000, 125000, 500000, 1000000
            ], []);

            const questions = useMemo(() => [
                {
                q: "Wofür steht die Abkürzung PDCA, die die Basis beider Normen bildet?",
                options: ["Please Do Call Again", "Plan Do Check Act", "Process Data Control Audit", "Plan Direct Control Act"],
                correct: 1
                },
                {
                q: "Welches Thema behandelt die ISO 14001 primär?",
                options: ["Qualitätsmanagement", "Arbeitssicherheit", "Umweltmanagement", "IT-Sicherheit"],
                correct: 2
                },
                {
                q: "Was ist das Hauptziel der ISO 50001?",
                options: ["Erhöhung des Umsatzes", "Verbesserung der energiebezogenen Leistung", "Reduzierung von Personal", "Digitalisierung der Buchhaltung"],
                correct: 1
                },
                {
                q: "Wie nennt man die gemeinsame Grundstruktur moderner ISO-Normen (Kapitel 1-10)?",
                options: ["High Level Structure (HLS)", "Basic Standard Layout", "ISO Common Core", "Unified Management Grid"],
                correct: 0
                },
                {
                q: "Was muss gemäß ISO 14001 bestimmt werden, um den Kontext der Organisation zu verstehen?",
                options: ["Interne und externe Themen", "Nur die Mitbewerber", "Der Aktienkurs", "Die Urlaubsplanung"],
                correct: 0
                },
                {
                q: "Was ist eine EnPI gemäß ISO 50001?",
                options: ["Energy Price Index", "Energy Performance Indicator", "Environment Protection Item", "Entropy Power Input"],
                correct: 1
                },
                {
                q: "Welche Dokumentation ist für die energetische Ausgangsbasis (EnB) erforderlich?",
                options: ["Ein Foto vom Zähler", "Datenerfassung über einen geeigneten Zeitraum", "Schätzung des Hausmeisters", "Die Stromrechnung von 1990"],
                correct: 1
                },
                {
                q: "Wer ist in der ISO 14001:2015 explizit für die Wirksamkeit des Managementsystems rechenschaftspflichtig?",
                options: ["Der Umweltbeauftragte", "Die oberste Leitung", "Der externe Auditor", "Die Personalabteilung"],
                correct: 1
                },
                {
                q: "Was versteht man unter 'bindenden Verpflichtungen' in der ISO 14001?",
                options: ["Nur Gesetze und Verordnungen", "Vertragliche Vereinbarungen", "Gesetzliche und sonstige Anforderungen", "Mündliche Absprachen"],
                correct: 2
                },
                {
                q: "Welcher Begriff beschreibt signifikante Veränderungen in der Energieeffizienz oder Energienutzung?",
                options: ["SEU (Significant Energy Use)", "Energieverschwendung", "Peak Load", "Grundlast"],
                correct: 0
                },
                {
                q: "Wie oft muss laut Norm ein internes Audit durchgeführt werden?",
                options: ["Täglich", "In geplanten Abständen", "Nur wenn der Kunde fragt", "Alle 5 Jahre"],
                correct: 1
                },
                {
                q: "Was ist der Unterschied zwischen Umweltaspekt und Umweltauswirkung?",
                options: ["Es gibt keinen", "Aspekt ist Ursache, Auswirkung ist Folge", "Aspekt ist negativ, Auswirkung positiv", "Auswirkung ist Theorie, Aspekt ist Praxis"],
                correct: 1
                },
                {
                q: "Welches Kapitel der HLS befasst sich mit der 'Bewertung der Leistung'?",
                options: ["Kapitel 4", "Kapitel 7", "Kapitel 9", "Kapitel 10"],
                correct: 2
                },
                {
                q: "Was fordert ISO 50001 bzgl. der Beschaffung von energiebetriebenen Einrichtungen?",
                options: ["Immer das Billigste kaufen", "Bewertung der Energieleistung über die Lebensdauer", "Kauf nur von lokalen Händlern", "Keine spezifischen Forderungen"],
                correct: 1
                },
                {
                q: "Wie definiert die ISO 14001 den 'Lebensweg' (Life Cycle)?",
                options: ["Von der Geburt bis zum Tod", "Rohstoffgewinnung bis zur Entsorgung", "Produktionsstart bis Warenausgang", "Garantiezeitraum des Produkts"],
                correct: 1
                }
            ], []);

            const handleStart = () => {
                setGameState('playing');
                setCurrentQuestionIndex(0);
                setEarnedAmount(0);
                setLifelines({ fiftyFifty: true, audience: true, phone: true });
                setHiddenAnswers([]);
                setRevealResult(false);
                setSelectedAnswer(null);
            };

            const handleAnswerSelect = (index) => {
                if (revealResult) return;
                setSelectedAnswer(index);

                setTimeout(() => {
                    setRevealResult(true);
                    const isCorrect = index === questions[currentQuestionIndex].correct;

                    setTimeout(() => {
                        if (isCorrect) {
                            if (currentQuestionIndex < questions.length - 1) {
                                setEarnedAmount(moneyLadder[currentQuestionIndex]);
                                setCurrentQuestionIndex(prev => prev + 1);
                                setRevealResult(false);
                                setSelectedAnswer(null);
                                setHiddenAnswers([]);
                            } else {
                                setEarnedAmount(moneyLadder[currentQuestionIndex]);
                                setGameState('won');
                            }
                        } else {
                            let safetyAmount = 0;
                            if (currentQuestionIndex >= 10) safetyAmount = 16000;
                            else if (currentQuestionIndex >= 5) safetyAmount = 500;
                            
                            setEarnedAmount(safetyAmount);
                            setGameState('lost');
                        }
                    }, 2500); 
                }, 1500);
            };

            const activate5050 = () => {
                if (!lifelines.fiftyFifty || revealResult) return;
                const correctIndex = questions[currentQuestionIndex].correct;
                const wrongIndices = [0, 1, 2, 3].filter(i => i !== correctIndex);
                const shuffledWrong = wrongIndices.sort(() => 0.5 - Math.random());
                setHiddenAnswers([shuffledWrong[0], shuffledWrong[1]]);
                setLifelines(prev => ({ ...prev, fiftyFifty: false }));
            };

            const activateAudience = () => {
                if (!lifelines.audience || revealResult) return;
                const correctIndex = questions[currentQuestionIndex].correct;
                const accuracy = Math.max(95 - (currentQuestionIndex * 5), 40); 
                const correctPercent = accuracy;
                let remaining = 100 - correctPercent;
                
                const stats = [0, 0, 0, 0];
                stats[correctIndex] = correctPercent;
                
                [0,1,2,3].forEach(i => {
                    if (i !== correctIndex) {
                        if (hiddenAnswers.includes(i)) {
                            stats[i] = 0;
                        } else {
                            const share = Math.floor(Math.random() * remaining);
                            stats[i] = share;
                            remaining -= share;
                        }
                    }
                });
                const validWrong = [0,1,2,3].filter(i => i !== correctIndex && !hiddenAnswers.includes(i));
                if(validWrong.length > 0) stats[validWrong[0]] += remaining;

                setJokerModalContent({ type: 'audience', data: stats });
                setIsJokerModalOpen(true);
                setLifelines(prev => ({ ...prev, audience: false }));
            };

            const activatePhone = () => {
                if (!lifelines.phone || revealResult) return;
                const correctIndex = questions[currentQuestionIndex].correct;
                const options = questions[currentQuestionIndex].options;
                const isHard = currentQuestionIndex > 9;
                const expertIsRight = Math.random() > (isHard ? 0.3 : 0.05);
                const suggestion = expertIsRight 
                    ? options[correctIndex] 
                    : options.find((_, i) => i !== correctIndex);

                setJokerModalContent({ 
                    type: 'phone', 
                    text: `Ich bin mir ziemlich sicher, die Antwort ist "${suggestion}". Zu ${isHard ? '80' : '99'}%!` 
                });
                setIsJokerModalOpen(true);
                setLifelines(prev => ({ ...prev, phone: false }));
            };

            const formatCurrency = (val) => new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(val);

            const getButtonColor = (index) => {
                const isCorrect = index === questions[currentQuestionIndex].correct;
                const isSelected = selectedAnswer === index;

                if (revealResult) {
                    if (isCorrect) return "animate-pulse-green text-black border-green-300 font-bold";
                    if (isSelected && !isCorrect) return "bg-red-600 text-white border-red-400";
                }
                if (isSelected) return "bg-yellow-500 text-black border-yellow-200 font-bold shadow-[0_0_15px_rgba(234,179,8,0.6)]";
                
                return "bg-slate-900/80 hover:bg-slate-700 hover:border-blue-400 text-white border-slate-500";
            };

            return (
                <div className="min-h-screen bg-gradient-to-b from-slate-950 via-blue-950 to-black text-white font-sans flex flex-col items-center justify-center p-4 overflow-hidden relative selection:bg-yellow-500 selection:text-black">
                    
                    {/* Background Radial FX */}
                    <div className="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-blue-900/20 via-slate-950 to-slate-950 pointer-events-none"></div>

                    {/* START SCREEN */}
                    {gameState === 'start' && (
                        <div className="z-10 text-center max-w-2xl glass-panel p-12 rounded-3xl shadow-2xl animate-[fadeIn_1s_ease-out]">
                            <Trophy className="w-32 h-32 text-yellow-500 mx-auto mb-8 drop-shadow-[0_0_25px_rgba(234,179,8,0.6)] animate-pulse" />
                            <h1 className="text-5xl md:text-7xl font-bold mb-4 text-transparent bg-clip-text bg-gradient-to-r from-yellow-200 via-yellow-500 to-yellow-600 drop-shadow-sm tracking-tighter">
                                ISO EXPERTE
                            </h1>
                            <p className="text-2xl mb-10 text-blue-200 font-light">Wer wird Millionär: ISO 14001 & 50001 Edition</p>
                            <button 
                                onClick={handleStart}
                                className="px-10 py-5 bg-gradient-to-r from-blue-700 to-blue-500 hover:from-blue-600 hover:to-blue-400 rounded-full text-2xl font-bold shadow-[0_0_20px_rgba(37,99,235,0.5)] transform hover:scale-105 transition-all border border-blue-400 text-white"
                            >
                                Spiel starten
                            </button>
                        </div>
                    )}

                    {/* END SCREEN */}
                    {(gameState === 'won' || gameState === 'lost') && (
                        <div className="z-10 text-center max-w-2xl glass-panel p-12 rounded-3xl shadow-2xl">
                            {gameState === 'won' ? (
                                <Trophy className="w-40 h-40 text-yellow-400 mx-auto mb-6 animate-bounce drop-shadow-[0_0_20px_rgba(234,179,8,0.8)]" />
                            ) : (
                                <XCircle className="w-32 h-32 text-red-500 mx-auto mb-6 drop-shadow-[0_0_20px_rgba(239,68,68,0.6)]" />
                            )}
                            <h2 className="text-4xl md:text-6xl font-bold mb-4 tracking-tight">
                                {gameState === 'won' ? "MILLIONÄR!" : "Spiel vorbei"}
                            </h2>
                            <p className="text-3xl text-blue-200 mb-10">Gewinnsumme: <span className="text-yellow-400 font-mono font-bold drop-shadow-md">{formatCurrency(earnedAmount)}</span></p>
                            <button 
                                onClick={handleStart}
                                className="px-8 py-4 bg-white text-blue-900 rounded-full font-bold hover:bg-gray-200 transition-colors flex items-center justify-center gap-3 mx-auto shadow-lg text-lg"
                            >
                                <RefreshCw size={24} /> Noch einmal
                            </button>
                        </div>
                    )}

                    {/* GAME UI */}
                    {gameState === 'playing' && (
                        <div className="w-full max-w-7xl z-10 flex flex-col md:flex-row gap-8 h-full">
                            
                            {/* Main Game Area */}
                            <div className="flex-1 flex flex-col justify-end min-h-[60vh] md:pb-10">
                                
                                {/* Question Bubble */}
                                <div className="mb-10 relative group">
                                    <div className="absolute inset-0 bg-blue-600 blur-xl opacity-20 group-hover:opacity-30 transition-opacity rounded-full"></div>
                                    <div className="bg-gradient-to-b from-slate-900 to-blue-950 border-2 border-blue-500/50 rounded-full relative py-6 px-10 text-center shadow-[0_0_15px_rgba(59,130,246,0.2)]">
                                        <div className="answer-line-left"></div>
                                        <div className="answer-line-right"></div>
                                        <h3 className="text-xl md:text-3xl font-semibold leading-relaxed text-white drop-shadow-md">
                                            {questions[currentQuestionIndex].q}
                                        </h3>
                                    </div>
                                </div>

                                {/* Answers Grid */}
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                                    {questions[currentQuestionIndex].options.map((opt, idx) => (
                                        <button
                                            key={idx}
                                            disabled={revealResult || hiddenAnswers.includes(idx)}
                                            onClick={() => handleAnswerSelect(idx)}
                                            className={`
                                                relative group py-4 px-8 rounded-full border-2 transition-all duration-200
                                                flex items-center text-left text-lg
                                                ${hiddenAnswers.includes(idx) ? 'opacity-0 pointer-events-none' : 'opacity-100'}
                                                ${getButtonColor(idx)}
                                            `}
                                        >
                                            <div className="answer-line-left w-4"></div>
                                            <div className="answer-line-right w-4"></div>
                                            <span className="text-yellow-500 font-bold mr-4 text-xl w-6 drop-shadow-sm">{String.fromCharCode(65 + idx)}:</span>
                                            <span className="font-medium tracking-wide">{opt}</span>
                                        </button>
                                    ))}
                                </div>

                                {/* Mobile Jokers */}
                                <div className="flex justify-center gap-8 mt-2 md:hidden">
                                    <JokerButton icon={Divide} active={lifelines.fiftyFifty} onClick={activate5050} />
                                    <JokerButton icon={Users} active={lifelines.audience} onClick={activateAudience} />
                                    <JokerButton icon={Phone} active={lifelines.phone} onClick={activatePhone} />
                                </div>
                            </div>

                            {/* Sidebar: Jokers & Ladder */}
                            <div className="hidden md:flex flex-col w-72 shrink-0 glass-panel rounded-2xl p-6 shadow-xl h-fit">
                                
                                <div className="flex justify-between mb-8 px-2">
                                    <JokerButton icon={Divide} active={lifelines.fiftyFifty} onClick={activate5050} />
                                    <JokerButton icon={Users} active={lifelines.audience} onClick={activateAudience} />
                                    <JokerButton icon={Phone} active={lifelines.phone} onClick={activatePhone} />
                                </div>

                                <div className="flex flex-col-reverse gap-1 overflow-hidden">
                                    {moneyLadder.map((amount, idx) => {
                                        const isCurrent = idx === currentQuestionIndex;
                                        const isPast = idx < currentQuestionIndex;
                                        const isSafety = idx === 4 || idx === 9;
                                        const isMillion = idx === 14;
                                        
                                        return (
                                            <div 
                                                key={idx} 
                                                className={`
                                                    flex justify-between px-4 py-1.5 rounded text-base font-mono transition-all duration-300
                                                    ${isCurrent ? 'bg-gradient-to-r from-yellow-600 to-yellow-400 text-black font-bold scale-105 shadow-lg z-10 -mx-2' : ''}
                                                    ${isPast ? 'text-green-500/50' : ''}
                                                    ${!isCurrent && !isPast && isSafety ? 'text-white font-bold' : ''}
                                                    ${!isCurrent && !isPast && !isSafety ? 'text-yellow-600' : ''}
                                                    ${isMillion && !isCurrent ? 'text-purple-400 font-bold' : ''}
                                                `}
                                            >
                                                <span className="opacity-70">{idx + 1}</span>
                                                <span className={isCurrent ? 'text-black' : ''}>{formatCurrency(amount)}</span>
                                            </div>
                                        )
                                    })}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL */}
                    {isJokerModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/90 backdrop-blur-sm p-4 animate-[fadeIn_0.2s_ease-out]">
                            <div className="bg-slate-900 border-2 border-yellow-500 rounded-2xl p-8 max-w-md w-full shadow-[0_0_50px_rgba(234,179,8,0.2)]">
                                <h3 className="text-3xl font-bold text-yellow-500 mb-6 border-b border-gray-700 pb-4">
                                    {jokerModalContent?.type === 'audience' ? 'Publikumsjoker' : 'Telefonjoker'}
                                </h3>
                                
                                <div className="mb-8">
                                    {jokerModalContent?.type === 'phone' && (
                                        <div className="flex flex-col gap-4">
                                            <div className="flex items-center gap-4 text-blue-300">
                                                <div className="bg-blue-900/50 p-4 rounded-full border border-blue-500"><Phone size={32} /></div>
                                                <span className="font-bold text-lg">Experte sagt:</span>
                                            </div>
                                            <p className="text-xl italic text-white bg-slate-800 p-6 rounded-r-2xl rounded-bl-2xl border-l-4 border-yellow-500 shadow-inner">
                                                "{jokerModalContent.text}"
                                            </p>
                                        </div>
                                    )}

                                    {jokerModalContent?.type === 'audience' && (
                                        <div className="flex justify-around items-end h-48 gap-3 pt-6 bg-slate-800/50 rounded-xl p-4 border border-slate-700">
                                            {jokerModalContent.data.map((pct, i) => (
                                                <div key={i} className="flex flex-col items-center w-full group relative">
                                                    <div className="absolute -top-8 text-sm font-bold text-yellow-300 opacity-0 group-hover:opacity-100 transition-opacity bg-black px-2 py-1 rounded">{pct}%</div>
                                                    <div className="text-xs mb-1 font-bold text-blue-200">{pct}%</div>
                                                    <div 
                                                        className="w-full bg-gradient-to-t from-blue-700 to-blue-400 border-t border-blue-300 rounded-t-md shadow-[0_0_10px_rgba(59,130,246,0.4)] transition-all duration-1000 ease-out relative overflow-hidden"
                                                        style={{ height: `${pct}%` }}
                                                    >
                                                        <div className="absolute inset-0 bg-white/20 skew-y-12 transform origin-bottom-left"></div>
                                                    </div>
                                                    <div className="mt-3 font-bold text-yellow-500 text-xl">{String.fromCharCode(65 + i)}</div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>

                                <button 
                                    onClick={() => setIsJokerModalOpen(false)}
                                    className="w-full py-3 bg-yellow-600 hover:bg-yellow-500 text-black font-bold rounded-xl transition-all text-lg shadow-lg hover:shadow-yellow-500/20"
                                >
                                    Alles klar, danke!
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const JokerButton = ({ icon: Icon, active, onClick }) => (
            <button 
                onClick={onClick}
                disabled={!active}
                className={`
                    relative flex items-center justify-center w-16 h-16 rounded-full border-2 transition-all duration-300 group
                    ${active 
                        ? 'border-blue-400 text-blue-100 hover:bg-blue-500/20 hover:scale-110 hover:border-white hover:shadow-[0_0_15px_rgba(255,255,255,0.4)]' 
                        : 'border-slate-800 text-slate-700 bg-black/50 cursor-not-allowed'}
                `}
            >
                <Icon size={28} />
                {!active && <div className="absolute inset-0 flex items-center justify-center text-red-600/80 text-5xl font-bold rotate-45 select-none">+</div>}
            </button>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Game />);
    </script>
</body>
</html>
